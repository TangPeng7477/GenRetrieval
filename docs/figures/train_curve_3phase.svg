<text x="34" y="350" font-size="11" fill="#5F5E5A">读数：重建 9.74 → 3.43（−65%，单调下降）；量化 0.05 → 5.42（单调上升，encoder 把 latent 拉远以换取更好重建）</text>
<text x="34" y="368" font-size="11" fill="#5F5E5A">含义：总损失后段回升是 rate-distortion 的记账位移，不是过拟合 → 按碰撞率选 ckpt（ep4950），而不是按总损失</text>
