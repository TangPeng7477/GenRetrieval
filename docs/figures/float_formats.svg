<svg viewBox="0 0 680 452" width="680" height="452" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<title>浮点格式的位分配：指数位宽决定范围，尾数位宽决定精度</title>
<desc>上半部分按位画出 fp32 / tf32 / bf16 / fp16 / fp8 的 符号-指数-尾数 分配；下半部分用对数数轴对比各自能表示的数值范围。fp32 与 bf16 共享 8 位指数，量级都是 1e-38 到 3.4e38；fp16 指数只有 5 位，范围只有 6.1e-5 到 6.55e4，跨度仅 9 个数量级，而梯度常落在 1e-8 到 1e-4，会下溢成 0，所以需要 loss scaling。</desc>
<rect x="0" y="0" width="680" height="452" fill="#FFFFFF"/>

<text x="34" y="24" font-size="14" font-weight="500" fill="#2C2C2A">浮点格式：指数位宽决定「能表示多大」，尾数位宽决定「能表示多细」</text>
<text x="34" y="42" font-size="11.5" fill="#888780">同样是 16 bit 的预算：bf16 把 8 位给指数、7 位给尾数；fp16 反过来给 5 位指数、10 位尾数 —— 这一条决定了它们各自的短板</text>

<!-- ============ Panel A: bit layout ============ -->
<text x="34" y="74" font-size="12" font-weight="500" fill="#2C2C2A">① 位是怎么切的（灰 = 符号 1 位 · 紫 = 指数 · 橙 = 尾数；1 格 = 1 bit）</text>

<!-- fp32 -->
<text x="92" y="96" font-size="11.5" fill="#2C2C2A" text-anchor="end">fp32</text>
<rect x="100" y="84" width="14" height="16" fill="#D3D1C7"/>
<rect x="114" y="84" width="112" height="16" fill="#534AB7"/>
<rect x="226" y="84" width="322" height="16" fill="#BA7517"/>
<text x="170" y="96" font-size="9.5" fill="#FFFFFF" text-anchor="middle">8 指数</text>
<text x="387" y="96" font-size="9.5" fill="#FFFFFF" text-anchor="middle">23 尾数（分辨到 10⁻⁷）</text>
<text x="556" y="96" font-size="10.5" fill="#5F5E5A">训练默认（稳，但慢且占显存）</text>

<!-- tf32 -->
<text x="92" y="126" font-size="11.5" fill="#2C2C2A" text-anchor="end">tf32</text>
<rect x="100" y="114" width="14" height="16" fill="#D3D1C7"/>
<rect x="114" y="114" width="112" height="16" fill="#534AB7"/>
<rect x="226" y="114" width="140" height="16" fill="#F0C674"/>
<text x="170" y="126" font-size="9.5" fill="#FFFFFF" text-anchor="middle">8 指数</text>
<text x="296" y="126" font-size="9.5" fill="#5F5E5A" text-anchor="middle">10</text>
<text x="556" y="126" font-size="10.5" fill="#5F5E5A">A100+ 矩阵乘自动启用，存储仍 32 位</text>

<!-- bf16 -->
<text x="92" y="156" font-size="11.5" font-weight="500" fill="#534AB7" text-anchor="end">bf16</text>
<rect x="100" y="144" width="14" height="16" fill="#D3D1C7"/>
<rect x="114" y="144" width="112" height="16" fill="#534AB7"/>
<rect x="226" y="144" width="98" height="16" fill="#BA7517"/>
<text x="170" y="156" font-size="9.5" fill="#FFFFFF" text-anchor="middle">8 指数</text>
<text x="275" y="156" font-size="9.5" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="556" y="156" font-size="10.5" fill="#534AB7">范围同 fp32 → 不需要 loss scaling</text>

<!-- fp16 -->
<text x="92" y="186" font-size="11.5" fill="#2C2C2A" text-anchor="end">fp16</text>
<rect x="100" y="174" width="14" height="16" fill="#D3D1C7"/>
<rect x="114" y="174" width="70" height="16" fill="#534AB7"/>
<rect x="184" y="174" width="140" height="16" fill="#BA7517"/>
<text x="149" y="186" font-size="9.5" fill="#FFFFFF" text-anchor="middle">5 指数</text>
<text x="254" y="186" font-size="9.5" fill="#FFFFFF" text-anchor="middle">10 尾数</text>
<text x="556" y="186" font-size="10.5" fill="#BA7517">范围只到 ±65504 → 必须 loss scaling</text>

<!-- fp8 -->
<text x="92" y="216" font-size="11.5" fill="#2C2C2A" text-anchor="end">fp8</text>
<rect x="100" y="204" width="14" height="16" fill="#D3D1C7"/>
<rect x="114" y="204" width="56" height="16" fill="#534AB7"/>
<rect x="170" y="204" width="42" height="16" fill="#BA7517"/>
<text x="191" y="216" font-size="9.5" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="556" y="216" font-size="10.5" fill="#5F5E5A">E4M3；推理量化常用，训练另有 recipe</text>

<!-- ============ Panel B: representable range ============ -->
<text x="34" y="258" font-size="12" font-weight="500" fill="#2C2C2A">② 能表示多大（对数轴 · 1e-20 到 1e20，每 13 px 一个数量级）</text>

<line x1="100" y1="292" x2="620" y2="292" stroke="#D3D1C7" stroke-width="1"/>
<text x="100" y="306" font-size="10" fill="#888780" text-anchor="middle">1e-20</text>
<text x="165" y="306" font-size="10" fill="#888780" text-anchor="middle">1e-15</text>
<text x="230" y="306" font-size="10" fill="#888780" text-anchor="middle">1e-10</text>
<text x="295" y="306" font-size="10" fill="#888780" text-anchor="middle">1e-5</text>
<text x="360" y="306" font-size="10" fill="#888780" text-anchor="middle">1e0</text>
<text x="425" y="306" font-size="10" fill="#888780" text-anchor="middle">1e5</text>
<text x="490" y="306" font-size="10" fill="#888780" text-anchor="middle">1e10</text>
<text x="555" y="306" font-size="10" fill="#888780" text-anchor="middle">1e15</text>
<text x="620" y="306" font-size="10" fill="#888780" text-anchor="middle">1e20</text>

<!-- fp32 / bf16 : 超出坐标轴范围 -->
<rect x="100" y="314" width="520" height="15" rx="2" fill="#534AB7" opacity="0.85"/>
<text x="108" y="325" font-size="10" fill="#FFFFFF">fp32 / bf16（8 位指数）：1e-38 … 3.4e38 —— 宽到超出本坐标轴的两端</text>

<!-- fp16 : 305.2 .. 422.6 -->
<rect x="305" y="335" width="118" height="15" rx="2" fill="#BA7517"/>
<text x="309" y="346" font-size="9.5" fill="#FFFFFF">fp16</text>
<text x="428" y="346" font-size="10" fill="#BA7517">6.1e-5 … 6.55e4 ⟹ 跨度只有 9 个数量级（bf16 是 76 个）</text>

<!-- fp8 : 336.5 .. 394.5 -->
<rect x="336" y="356" width="59" height="15" rx="2" fill="#0F6E56"/>
<text x="340" y="367" font-size="9.5" fill="#FFFFFF">fp8</text>
<text x="400" y="367" font-size="10" fill="#0F6E56">0.016 … 448</text>

<!-- 梯度量级带 : 1e-8 .. 1e-4 -->
<rect x="256" y="377" width="52" height="15" rx="2" fill="#F1EFE8" stroke="#B4B2A9" stroke-dasharray="3 2"/>
<line x1="305" y1="384.5" x2="305" y2="335" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 3"/>
<text x="256" y="404" font-size="10" fill="#5F5E5A">梯度 / 激活常见量级 1e-8 … 1e-4 —— 整段落在 fp16 下界之外</text>
<text x="256" y="417" font-size="10" fill="#BA7517">↑ 直接算会下溢成 0 ⟹ 必须先把 loss 放大（loss scaling）再用 fp16 反传</text>

<text x="34" y="438" font-size="10.5" fill="#888780">注：范围取各格式「最大正规数 / 最小正规数」。fp32 与 bf16 共享 8 位指数，量级完全一致，差别只在尾数精度（1e-7 vs 8e-3）。</text>
<text x="34" y="450" font-size="10.5" fill="#888780">本图数值来自 IEEE-754 与 Google bfloat16 定义，属公开规格，非本项目实测。</text>
</svg>
